$$schema: "https://schemas.optimade.org/meta/v1.2/optimade/property_definition"
$id: "https://example.org/schemas/v0.1/properties/nomad/_nomad_electronic_dos"
title: "Electronic Density of States"
$comment: "Generic electronic density of states data."
x-optimade-type: "dictionary"
x-optimade-definition:
  kind: "property"
  version: "0.1.0"
  format: "1.2"
  name: "_nomad_electronic_dos"
  label: "_nomad_electronic_dos_nomad"
type:
  - "object"
  - "null"
description: |-
  Generic electronic density of states data.
  
  - **Type**: object containing energy grid and DOS values.
  - **Requirements/Conventions**:
    - **Support**: SHOULD be supported by implementations focused on electronic structure.
    - **Query**: SHOULD be queryable for DOS analysis.
examples:
  - {"energies": [-5, -4, -3, -2, -1], "values": [0.1, 0.2, 0.3, 0.2, 0.1]}
x-optimade-unit: "inapplicable"
properties:
  energies:
    x-optimade-type: "list"
    type:
      - "array"
    x-optimade-unit: "joule"
    items:
      x-optimade-type: "float"
      type:
        - "number"
      x-optimade-unit: "joule"
  values:
    x-optimade-type: "list"
    type:
      - "array"
    x-optimade-unit: "1/joule"
    items:
      x-optimade-type: "float"
      type:
        - "number"
      x-optimade-unit: "1/joule"