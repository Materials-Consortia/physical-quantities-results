  - "null"
description: |-
  Magnetic moments per atom or total system magnetic moment.
  
  - **Type**: array of magnetic moment vectors.
  - **Requirements/Conventions**:
    - **Support**: SHOULD be supported by implementations focused on magnetic systems.
    - **Query**: SHOULD be queryable for magnetic property analysis.
examples:
  - [[0.0, 0.0, 2.1], [0.0, 0.0, -2.1]]
  - [[1.5, 0.2, 0.8]]
